<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Theater - target (Simulate 1)</title>
  <style>
    :root { --bg: #f6f5f2; --card: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0da; --accent: #2f5bd3; --warn: #a15c00; --refuse: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: baseline; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--card); }
    header h1 { font-size: 17px; margin: 0; }
    header .meta { color: var(--muted); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #eef1fb; color: var(--accent); font-size: 12px; }
    main { display: grid; grid-template-columns: 1fr 380px; gap: 18px; padding: 18px 22px; }
    section.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
    .takes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .take { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .take.selected { border-color: var(--accent); box-shadow: 0 0 0 2px #2f5bd333; }
    .frame { height: 110px; border-radius: 6px; background: repeating-linear-gradient(45deg, #ecebe6, #ecebe6 8px, #e4e2dc 8px, #e4e2dc 16px); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
    .scores { margin-top: 6px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
    .absent { color: var(--warn); }
    .none { color: var(--muted); font-style: italic; }
    .axis { border-top: 1px solid var(--line); padding: 8px 0; }
    .axis:first-of-type { border-top: 0; }
    .withheld { color: var(--warn); }
    .counts { color: var(--muted); font-size: 12px; }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
    .refused { color: var(--refuse); font-weight: 600; }
    button { font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent); }
    .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .stack { display: grid; gap: 18px; align-content: start; }
    footer { padding: 0 22px 18px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">Loading the sealed library...</div>
  <script type="module" src="./target.ts"></script>
</body>
</html>
