<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Target vs built - batch 1</title>
  <style>
    body { margin: 0; font: 13px system-ui, sans-serif; background: #ddd; }
    .bar { display: flex; gap: 12px; padding: 6px 10px; background: #1f2430; color: #fff; }
    .bar a { color: #9cc3ff; }
    .bar a.on { color: #fff; font-weight: 600; text-decoration: none; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    .pane { background: #fff; }
    .pane h3 { margin: 0; padding: 6px 10px; background: #1f2430; color: #fff; font-size: 13px; }
    .frame { width: 100%; overflow: hidden; position: relative; }
    iframe { border: 0; transform-origin: 0 0; position: absolute; }
  </style>
</head>
<body>
  <div class="bar"><b>Format</b><a href="?f=phone">phone 375</a><a href="?f=tablet">tablet 768</a><a href="?f=screen">screen 1280</a></div>
  <div class="pair">
    <div class="pane"><h3>TARGET - Simulate 1 (preview over the invented fixture)</h3><div class="frame"><iframe src="./target.html"></iframe></div></div>
    <div class="pane"><h3>BUILT - batch 1 (the shell, cell 3.2, take 3 selected)</h3><div class="frame"><iframe src="../index.html#3.2/3"></iframe></div></div>
  </div>
  <script>
    // Each page is laid out at the format's own viewport (so its media queries fire) and scaled to its column.
    const FORMATS = { phone: [375, 812], tablet: [768, 1024], screen: [1280, 900] };
    const f = new URLSearchParams(location.search).get("f") ?? "screen";
    const [w, h] = FORMATS[f] ?? FORMATS.screen;
    document.querySelectorAll(".bar a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === `?f=${f}`));
    const fit = () => document.querySelectorAll(".frame").forEach((frame) => {
      const k = Math.min(1, frame.clientWidth / w);
      const iframe = frame.querySelector("iframe");
      Object.assign(iframe.style, { width: `${w}px`, height: `${h}px`, transform: `scale(${k})` });
      frame.style.height = `${h * k}px`;
    });
    addEventListener("resize", fit);
    fit();
  </script>
</body>
</html>
